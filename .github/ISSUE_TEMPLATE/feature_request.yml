name: Feature request
description: An idea that would make finding sessions easier.
labels: ["enhancement"]
body:
  - type: textarea
    id: moment
    attributes:
      label: The moment it would have helped
      description: Describe the last time you went looking for a session and csearch didn't get you there.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
