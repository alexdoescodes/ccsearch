name: Bug report
description: Something doesn't work the way the README says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **Please don't paste session contents** — they can hold private prompts, paths or secrets.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        csearch docker volume
        expected the session from yesterday at the top, got ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: csearch version
      description: Output of `csearch --version`
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Linux, macOS, Other]
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal and shell
      placeholder: kitty + zsh
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Tracebacks, `csearch -p <query>` output (redact as needed), screenshots.
