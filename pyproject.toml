[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csearch"
dynamic = ["version"]
description = "Fuzzy-search your Claude Code sessions by topic and resume one with the arrow keys, from any directory."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Hohenhorst" }]
requires-python = ">=3.9"
dependencies = ["rapidfuzz>=3.0"]
keywords = ["claude", "claude-code", "cli", "fuzzy-search", "terminal", "sessions"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/alexdoescodes/csearch"
Issues = "https://github.com/alexdoescodes/csearch/issues"
Changelog = "https://github.com/alexdoescodes/csearch/blob/main/CHANGELOG.md"

[project.scripts]
csearch = "csearch:cli"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["csearch"]

[tool.setuptools.dynamic]
version = { attr = "csearch.__version__" }

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
# mostly inline SVG markup
"scripts/build_assets.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
