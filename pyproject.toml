[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csearch"
dynamic = ["version"]
description = "Fuzzy-search your Claude Code sessions by topic and resume one with the arrow keys, from any directory."
readme = "README.md"
license = "MIT"
authors = [{ name = "Alexander Hohenhorst" }]
requires-python = ">=3.10"
dependencies = ["rapidfuzz>=3.0"]

[project.urls]
Homepage = "https://github.com/alexdoescodes/csearch"

[project.scripts]
csearch = "csearch:cli"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
py-modules = ["csearch"]

[tool.setuptools.dynamic]
version = { attr = "csearch.__version__" }

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_assets.py" = ["E501"]  # inline SVG markup
