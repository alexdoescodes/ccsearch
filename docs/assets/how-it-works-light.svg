<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="912" height="176" viewBox="0 0 912 176" role="img" aria-labelledby="t d">
<title id="t">How ccsearch works</title>
<desc id="d">Four steps: read Claude Code transcripts, keep a cached index that only re-reads changed files, fuzzy-match on title, prompts and project path, then run claude --resume in the session's own directory.</desc>

  <g>
    <rect x="12" y="34" width="206" height="104" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="12" y="34" width="206" height="104" rx="12" fill="none" stroke="#0a7ea4" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
        values="0;0;1;0;0" keyTimes="0;0.0000;0.0875;0.3000;1"/>
    </rect>
    <text x="30" y="64" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.5" fill="#bc4c00" font-weight="700">01  READ</text>
    <text x="30" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1f2328">Transcripts</text>
    <text x="30" y="116" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#59636e">~/.claude/projects/*.jsonl</text>
  </g>
  <path d="M221 86H230" stroke="#0a7ea4" stroke-width="2" stroke-dasharray="4 4">
    <animate attributeName="stroke-dashoffset" values="8;0" dur=".6s" repeatCount="indefinite"/>
  </path>
  <path d="M229 81l6 5-6 5" fill="none" stroke="#0a7ea4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="238" y="34" width="206" height="104" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="238" y="34" width="206" height="104" rx="12" fill="none" stroke="#0a7ea4" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
        values="0;0;1;0;0" keyTimes="0;0.2500;0.3375;0.5500;1"/>
    </rect>
    <text x="256" y="64" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.5" fill="#bc4c00" font-weight="700">02  INDEX</text>
    <text x="256" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1f2328">Cached index</text>
    <text x="256" y="116" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#59636e">re-reads changed files only</text>
  </g>
  <path d="M447 86H456" stroke="#0a7ea4" stroke-width="2" stroke-dasharray="4 4">
    <animate attributeName="stroke-dashoffset" values="8;0" dur=".6s" repeatCount="indefinite"/>
  </path>
  <path d="M455 81l6 5-6 5" fill="none" stroke="#0a7ea4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="464" y="34" width="206" height="104" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="464" y="34" width="206" height="104" rx="12" fill="none" stroke="#0a7ea4" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
        values="0;0;1;0;0" keyTimes="0;0.5000;0.5875;0.8000;1"/>
    </rect>
    <text x="482" y="64" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.5" fill="#bc4c00" font-weight="700">03  RANK</text>
    <text x="482" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1f2328">Fuzzy match</text>
    <text x="482" y="116" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#59636e">title · prompts · path</text>
  </g>
  <path d="M673 86H682" stroke="#0a7ea4" stroke-width="2" stroke-dasharray="4 4">
    <animate attributeName="stroke-dashoffset" values="8;0" dur=".6s" repeatCount="indefinite"/>
  </path>
  <path d="M681 81l6 5-6 5" fill="none" stroke="#0a7ea4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="690" y="34" width="206" height="104" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="690" y="34" width="206" height="104" rx="12" fill="none" stroke="#0a7ea4" stroke-width="2" opacity="0">
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
        values="0;0;1;0;0" keyTimes="0;0.7500;0.8375;1.0000;1"/>
    </rect>
    <text x="708" y="64" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.5" fill="#bc4c00" font-weight="700">04  RESUME</text>
    <text x="708" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1f2328">claude --resume</text>
    <text x="708" y="116" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#59636e">in the session's own dir</text>
  </g>
</svg>
