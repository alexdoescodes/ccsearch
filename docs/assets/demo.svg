<title id="t">csearch demo</title>
<desc id="d">Terminal recording: typing 'csearch dokcer backup' (with a typo) lists the five best-matching Claude Code sessions. The selection moves with the arrow keys, Enter switches to ~/homelab and runs claude --resume on the chosen session.</desc>

